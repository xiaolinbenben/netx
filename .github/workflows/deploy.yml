name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            context: .
            dockerfile: server/Dockerfile
          - component: dashboard
            context: dashboard
            dockerfile: dashboard/Dockerfile
          - component: main
            context: landing
            dockerfile: landing/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/netx:${{ matrix.component }}-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/netx:${{ matrix.component }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: /opt/netx
      SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Upload deployment files
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SERVER_USER@$SERVER_HOST" "mkdir -p '$DEPLOY_PATH/deploy'"
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            deploy/docker-compose.yml deploy/.env.example \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/deploy/"

      - name: Pull and restart services
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SERVER_USER@$SERVER_HOST" \
            "docker login --username '$DOCKERHUB_USERNAME' --password-stdin"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && test -f deploy/.env && DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' IMAGE_TAG='$IMAGE_TAG' docker compose --env-file deploy/.env -f deploy/docker-compose.yml pull && DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' IMAGE_TAG='$IMAGE_TAG' docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --remove-orphans && DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' IMAGE_TAG='$IMAGE_TAG' docker compose --env-file deploy/.env -f deploy/docker-compose.yml ps"
