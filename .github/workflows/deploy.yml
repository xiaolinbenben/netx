name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: beisitech
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            beisitech/netx:latest
            beisitech/netx:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  deploy:
    name: Deploy production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: /opt/netx
      SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Upload deployment files
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SERVER_USER@$SERVER_HOST" "mkdir -p '$DEPLOY_PATH/deploy'"
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            deploy/docker-compose.yml deploy/.env.example \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/deploy/"

      - name: Pull and restart services
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && test -f deploy/.env && docker compose --env-file deploy/.env -f deploy/docker-compose.yml pull && docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --remove-orphans && docker compose --env-file deploy/.env -f deploy/docker-compose.yml ps"
